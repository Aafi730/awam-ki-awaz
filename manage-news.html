<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage News - Awam Ki Awaz</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f7fc;
            color: #333;
        }

        header {
            background: linear-gradient(135deg, #0d47a1, #1976d2);
            color: white;
            padding: 25px 20px;
        }

        .header-content {
            max-width: 1100px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin: 7px 0 0;
            font-size: 18px;
        }

        .back-btn {
            background: white;
            color: #0d47a1;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin-top: 0;
            color: #0d47a1;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 9px;
            font-size: 16px;
            font-family: Arial, sans-serif;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        .save-btn {
            margin-top: 20px;
            background: #0d47a1;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #1976d2;
        }

        .cancel-btn {
            margin-top: 20px;
            margin-left: 8px;
            background: #777;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }

        .news-item {
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 18px;
            margin-top: 15px;
            background: #fafafa;
        }

        .news-item h3 {
            margin-top: 0;
            color: #0d47a1;
        }

        .news-meta {
            color: #777;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .news-image {
            max-width: 180px;
            max-height: 120px;
            border-radius: 8px;
            margin: 10px 0;
            display: block;
        }

        .edit-btn {
            background: #1976d2;
            color: white;
            border: none;
            padding: 9px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 7px;
        }

        .delete-btn {
            background: #d32f2f;
            color: white;
            border: none;
            padding: 9px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .empty-message {
            color: #777;
            text-align: center;
            padding: 20px;
        }

        footer {
            text-align: center;
            padding: 25px;
            margin-top: 40px;
            background: #0d47a1;
            color: white;
        }

        @media (max-width: 600px) {

            header h1 {
                font-size: 25px;
            }

            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }

            .back-btn {
                align-self: flex-start;
            }

            .container {
                padding: 0 15px;
            }

            .card {
                padding: 20px;
            }

            .cancel-btn {
                margin-left: 0;
            }

        }

    </style>

</head>

<body>

<header>

    <div class="header-content">

        <div>

            <h1>Awam Ki Awaz</h1>

            <p>Manage News</p>

        </div>

        <a href="admin-dashboard.html" class="back-btn">
            ← Dashboard
        </a>

    </div>

</header>


<div class="container">

    <div class="card">

        <h2 id="formHeading">📰 Add New News</h2>

        <form id="newsForm">

            <label for="title">
                News Title
            </label>

            <input
                type="text"
                id="title"
                placeholder="Enter news title"
                required
            >


            <label for="category">
                Category
            </label>

            <select id="category" required>

                <option value="">
                    Select Category
                </option>

                <option value="News">
                    News
                </option>

                <option value="Politics">
                    Politics
                </option>

                <option value="Technology">
                    Technology
                </option>

                <option value="Government">
                    Government
                </option>

                <option value="Parliament">
                    Parliament
                </option>

                <option value="Election">
                    Election
                </option>

            </select>


            <label for="description">
                News Description
            </label>

            <textarea
                id="description"
                placeholder="Write your news here..."
                required
            ></textarea>


            <label for="image">
                Image URL (Optional)
            </label>

            <input
                type="text"
                id="image"
                placeholder="Paste image URL here"
            >


            <button
                type="submit"
                class="save-btn"
                id="saveButton"
            >
                💾 Save News
            </button>


            <button
                type="button"
                class="cancel-btn"
                id="cancelButton"
                onclick="cancelEdit()"
            >
                Cancel Edit
            </button>

        </form>

    </div>


    <div class="card">

        <h2>📋 Saved News</h2>

        <div id="newsList"></div>

    </div>

</div>


<footer>

    © 2026 Awam Ki Awaz. All Rights Reserved.

</footer>


<script>

    /* ==============================
       ADMIN LOGIN PROTECTION
    ============================== */

    if (
        sessionStorage.getItem("awamAdminLoggedIn")
        !== "true"
    ) {

        window.location.href = "admin.html";

    }


    /* ==============================
       NEWS DATA
    ============================== */

    let savedNews =
        localStorage.getItem("awamNews");

    if (!savedNews) {

        savedNews =
            localStorage.getItem("awamKiAwazNews");

    }


    let news = savedNews
        ? JSON.parse(savedNews)
        : [];


    let editingIndex = -1;


    const newsForm =
        document.getElementById("newsForm");

    const newsList =
        document.getElementById("newsList");

    const formHeading =
        document.getElementById("formHeading");

    const saveButton =
        document.getElementById("saveButton");

    const cancelButton =
        document.getElementById("cancelButton");


    /* ==============================
       SAVE NEWS DATA
    ============================== */

    function saveNewsData() {

        localStorage.setItem(
            "awamNews",
            JSON.stringify(news)
        );

    }


    /* ==============================
       DISPLAY NEWS
    ============================== */

    function displayNews() {

        newsList.innerHTML = "";


        if (news.length === 0) {

            newsList.innerHTML =
                '<div class="empty-message">No news added yet.</div>';

            return;

        }


        news.forEach(function(item, index) {

            const newsItem =
                document.createElement("div");

            newsItem.className =
                "news-item";


            newsItem.innerHTML = `

                <h3>
                    ${item.title}
                </h3>

                <div class="news-meta">
                    Category: ${item.category}
                </div>

                <p>
                    ${item.description}
                </p>

                ${
                    item.image
                    ? `
                        <img
                            src="${item.image}"
                            class="news-image"
                            alt="News Image"
                        >
                      `
                    : ""
                }

                <button
                    class="edit-btn"
                    onclick="editNews(${index})"
                >
                    ✏️ Edit
                </button>

                <button
                    class="delete-btn"
                    onclick="deleteNews(${index})"
                >
                    🗑️ Delete
                </button>

            `;


            newsList.appendChild(newsItem);

        });

    }


    /* ==============================
       ADD / UPDATE NEWS
    ============================== */

    newsForm.addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const title =
                document
                .getElementById("title")
                .value
                .trim();


            const category =
                document
                .getElementById("category")
                .value;


            const description =
                document
                .getElementById("description")
                .value
                .trim();


            const image =
                document
                .getElementById("image")
                .value
                .trim();


            const newsData = {

                title: title,

                category: category,

                description: description,

                image: image

            };


            /* UPDATE EXISTING NEWS */

            if (editingIndex !== -1) {

                news[editingIndex] =
                    newsData;

                alert(
                    "News updated successfully!"
                );

            }

            /* ADD NEW NEWS */

            else {

                news.push(newsData);

                alert(
                    "News saved successfully!"
                );

            }


            saveNewsData();


            newsForm.reset();

            editingIndex = -1;


            formHeading.innerHTML =
                "📰 Add New News";


            saveButton.innerHTML =
                "💾 Save News";


            cancelButton.style.display =
                "none";


            displayNews();

        }
    );


    /* ==============================
       EDIT NEWS
    ============================== */

    function editNews(index) {

        const item =
            news[index];


        document
        .getElementById("title")
        .value =
            item.title;


        document
        .getElementById("category")
        .value =
            item.category;


        document
        .getElementById("description")
        .value =
            item.description;


        document
        .getElementById("image")
        .value =
            item.image || "";


        editingIndex = index;


        formHeading.innerHTML =
            "✏️ Edit News";


        saveButton.innerHTML =
            "💾 Update News";


        cancelButton.style.display =
            "inline-block";


        window.scrollTo({

            top: 0,

            behavior: "smooth"

        });

    }


    /* ==============================
       CANCEL EDIT
    ============================== */

    function cancelEdit() {

        newsForm.reset();

        editingIndex = -1;


        formHeading.innerHTML =
            "📰 Add New News";


        saveButton.innerHTML =
            "💾 Save News";


        cancelButton.style.display =
            "none";

    }


    /* ==============================
       DELETE NEWS
    ============================== */

    function deleteNews(index) {

        if (
            confirm(
                "Are you sure you want to delete this news?"
            )
        ) {

            news.splice(index, 1);

            saveNewsData();

            displayNews();

        }

    }


    /* ==============================
       START
    ============================== */

    displayNews();

</script>


</body>

</html>
